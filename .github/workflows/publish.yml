name: Publish to PyPI (trusted publishing)

# Runs on a version tag (v<version>). The build job tests and builds the four distributions without any
# id-token; the publish job, bound to `release` (rakomi) or `release-<dist>` (each other distribution, as
# PyPI takes one pending publisher per owner/repo/workflow/environment), is the only job that can mint the
# OIDC token PyPI trusted publishing accepts, and uploads exactly the files the build job produced.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        dist: [rakomi, rakomi-sdk, rakomi-cli, rakomi-mcp]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.19"
          python-version: "3.13"
          enable-cache: false

      - name: The tag names the version of the distribution
        env:
          TAG: ${{ github.ref_name }}
          DIST: ${{ matrix.dist }}
        run: |
          set -euo pipefail
          VERSION="$(uv run --no-project python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "packages/${DIST}/pyproject.toml")"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "ERROR: tag ${TAG} does not match ${DIST} version ${VERSION}"
            exit 1
          fi

      - name: Tests
        run: uv run --no-project --with pytest pytest

      - name: Build
        env:
          DIST: ${{ matrix.dist }}
        run: uv build "packages/${DIST}" --out-dir "dist/${DIST}"

      - name: Check the distribution
        env:
          DIST: ${{ matrix.dist }}
        run: uvx twine check --strict "dist/${DIST}"/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.dist }}
          path: dist/${{ matrix.dist }}/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ matrix.dist == 'rakomi' && 'release' || format('release-{0}', matrix.dist) }}
      url: https://pypi.org/project/${{ matrix.dist }}/
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        dist: [rakomi, rakomi-sdk, rakomi-cli, rakomi-mcp]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.dist }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
